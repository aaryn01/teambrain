services:
  - type: web
    name: teambrain
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FALKORDB_HOST
        sync: false
      - key: FALKORDB_PORT
        sync: false
      - key: FALKORDB_USERNAME
        sync: false
      - key: FALKORDB_PASSWORD
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_REASONING_EFFORT
        value: low
      - key: LLM_FALLBACK_MODELS
        value: gemini-flash-lite-latest,gemini-3-flash-preview,gemini-3.5-flash
      - key: GRAPH_NAME
        value: teambrain
      - key: ALLOW_RESET
        value: "true"
